<meta name="description" content="Фильмы, которые red_pondaa смотрел на стримах: оценки, записи стримов и ссылки на Кинопоиск.">

<title>red_pondaa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* A dark bamboo wall with a sticker card on it. The wall stays dark in both
     themes — only the card flips, so the two modes are one palette swapped by
     role, never a second set of rules. */
  :root {
    --ground: #0e0e10;

    /* Everything below is in rem, so the whole interface — outlines, corners,
       posters, badges, the panda — grows with the root size set on <html>
       instead of staying pinned to a phone's proportions on a 27" monitor. */
    --stroke: 0.19rem;
    --drop: 0 0.38rem 0 rgba(0,0,0,0.55);

    /* Corners: a gentle squircle. border-radius is the fallback everywhere;
       corner-shape refines it to a superellipse where the browser knows it. */
    --r-card: 1.25rem;
    --r-mid: 0.75rem;
    --r-small: 0.56rem;

    --badge: 2.35rem;   /* the rating circle — sized to hold "10" without ovaling */
    --dot: 2.05rem;     /* the play circle */
  }

  /* The theme attribute lives on #app, not on the root: the artifact viewer
     stamps its own data-theme on the root element, and this would fight it. */
  #app {
    --surface: #fbf3e6;    /* the card */
    --surface-2: #fff;     /* inputs, chips, links sitting on the card */
    --text: #3e1616;
    --text-soft: #6d4038;
    --edge: #3e1616;       /* every thick sticker outline */
    --chip-on-bg: #3e1616; --chip-on-fg: #fbf3e6;
    --line: rgba(62,22,22,0.16);
    --underline: rgba(62,22,22,0.22);

    --orange: #e07a00;  --orange-lo: #faeed9;
    --good: #2f7d3a; --good-lo: #d8f0d4;
    --mid:  #a35c00; --mid-lo:  #fbe8c8;
    --bad:  #b3271e; --bad-lo:  #fadcd8;
    --grey: #6d6257; --grey-lo: #e8e0d2;
  }
  #app[data-theme="dark"] {
    --surface: #241d1c;
    --surface-2: #322827;
    --text: #f3e7d9;
    --text-soft: #b6a091;
    /* warmer and lighter than the card, so the outline still reads as an outline
       against both the card and the near-black bamboo behind it */
    --edge: #5b4741;
    --chip-on-bg: #f3e7d9; --chip-on-fg: #241d1c;
    --line: rgba(243,231,217,0.14);
    --underline: rgba(243,231,217,0.26);

    --orange: #f09a3c;  --orange-lo: #3a2c1c;
    --good: #8fd39a; --good-lo: #24382a;
    --mid:  #e9b96a; --mid-lo:  #3a2e1c;
    --bad:  #f0918a; --bad-lo:  #3d2422;
    --grey: #a3948a; --grey-lo: #322a28;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  /* One dial for the whole interface. It holds at 16px on phones, where the
     layout is already tight, and climbs with the viewport: ~18.8px on a 1440
     monitor, capped at 21px so a 4K panel doesn't run away with it. */
  html { font-size: clamp(16px, 14.2px + 0.32vw, 21px); }

    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #f3e7d9;
    font-family: Nunito, "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 1rem; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* a light vignette: settles the busy wall down without hiding the bamboo */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(1100px 760px at 50% 8%, rgba(8,10,8,0.10), rgba(5,7,5,0.55) 78%);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; }
  :focus-visible { outline: 0.19rem solid #ffd166; outline-offset: 0.13rem; }

  .shell {
    max-width: 50rem; margin: 0 auto; padding: 4.6rem 1rem 5.6rem;
    position: relative; z-index: 1;
  }
  /* The shelf needs room for six covers; a list of one-line titles stretched
     that wide just opens a gulf between each title and its score. */
  /* The width changes in one frame on purpose. Animating it was measured at 9
     frames against 28 for the same switch without it: every step of the stretch
     re-lays-out all 84 items, and no easing hides that. The cascade below covers
     the change instead. */
  #app[data-view="grid"] { max-width: 74rem; }

  /* ---------- one whole card: the panda lies on its top edge ---------- */
  .card {
    position: relative;
    border: var(--stroke) solid var(--edge);
    border-radius: var(--r-card);
    corner-shape: superellipse(1.6);
    background: var(--surface);
    box-shadow: var(--drop);
    color: var(--text);
  }
  /* No band and no rule under it: the head is simply the top of the card, in the
     card's own colour. The side padding is symmetric and as wide as the panda,
     which does two things at once — it keeps the title clear of her, and, being
     equal on both sides, it centres the title on the card rather than in
     whatever room she leaves over. */
  .card > .head {
    padding: 1.1rem 11rem;
    min-height: 4.6rem;
    display: flex; align-items: center; justify-content: center;
  }
  .card > .body { padding: 1rem 1.15rem 1.15rem; }
  .panda {
    position: absolute;
    /* Her underside's highest point is 43.4% down the art. At this width that
       lands just below the card's top edge, so she overlaps it rather than
       meeting it and no background shows through under her. */
    left: -0.94rem; top: -2.63rem;
    width: 11.6rem; height: auto;
    z-index: 3; pointer-events: none;
    filter: drop-shadow(0 0.25rem 0 rgba(0,0,0,0.4));
  }
  /* break-anywhere is the safety net: the name is one long unbreakable word, and
     without it a narrow screen would be pushed into horizontal scrolling */
  h1 {
    margin: 0; font-weight: 900; letter-spacing: -0.01em;
    text-align: center; overflow-wrap: anywhere;
    /* the name is one long unbreakable word and the panda has already taken the
       left third, so the size follows the room that is left */
    font-size: clamp(0.95rem, 2.5vw, 1.5rem);
  }

  .search-wrap { position: relative; display: flex; align-items: center; color: var(--orange); }
  .search-wrap > svg { position: absolute; left: 0.82rem; width: 1rem; height: 1rem; color: var(--text-soft); pointer-events: none; }
  .search-wrap input {
    width: 100%; border: 0.13rem solid var(--edge); border-radius: 999px; background: var(--surface-2); color: var(--text);
    padding: 0.56rem 2.5rem 0.56rem 2.25rem; font-size: 0.95rem; font-family: inherit; font-weight: 600;
  }
  .search-wrap input::placeholder { color: var(--text-soft); font-weight: 600; }
  .search-wrap input:focus { outline: none; box-shadow: inset 0 0 0 0.13rem currentColor; }
  .search-clear {
    position: absolute; right: 0.5rem; border: none; background: var(--chip-on-bg); color: var(--chip-on-fg);
    width: 1.4rem; height: 1.4rem; border-radius: 50%; cursor: pointer; font-size: 0.78rem;
    display: flex; align-items: center; justify-content: center;
  }
  .chipbar { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.7rem; flex-wrap: wrap; }
  .chip {
    border: 0.13rem solid var(--edge); border-radius: var(--r-small);
    corner-shape: superellipse(1.6);
    background: var(--surface-2); color: var(--text);
    padding: 0.28rem 0.7rem; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 0.25rem;
  }
  .chip.on { background: var(--chip-on-bg); color: var(--chip-on-fg); }
  .chip .arr { font-size: 0.7em; }

  /* view + theme switches: pushed to the far end of the sort row, so on a narrow
     screen they wrap onto their own line instead of squeezing the chips */
  .tools { margin-left: auto; display: flex; gap: 0.4rem; }
  .tool {
    width: 1.95rem; height: 1.95rem; padding: 0; cursor: pointer;
    border: 0.13rem solid var(--edge); border-radius: var(--r-small);
    corner-shape: superellipse(1.6);
    background: var(--surface-2); color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  .tool:hover { background: var(--orange-lo); }
  .tool svg { width: 0.95rem; height: 0.95rem; }

  /* ---------- rows ---------- */
  .rows { list-style: none; margin: 1rem 0 0; padding: 0; }
  .row { border-top: 0.13rem solid var(--line); }
  .row:first-child { border-top: none; }
  .row-main {
    width: 100%; display: flex; align-items: center; gap: 0.88rem; padding: 0.8rem 0.13rem;
    border: none; background: none; text-align: left; cursor: pointer; color: var(--text); font-family: inherit;
  }
  .row-num {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums;
    font-size: 0.75rem; font-weight: 700;
    color: var(--text-soft); min-width: 2.1em; flex: none; text-align: right;
  }
  /* Poster slot: the letter is painted underneath, and the cover art — when it
     loads — sits on top. Where external images are blocked (the artifact
     viewer's CSP) the image never appears and the letter simply stays. */
  .poster-slot {
    width: 6rem; height: 9rem; flex: none;
    border: 0.13rem solid var(--edge);
    border-radius: var(--r-mid); corner-shape: superellipse(1.6);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 2.3rem; color: #fff; text-shadow: 0 0.13rem 0 rgba(0,0,0,0.35);
  }
  .poster-slot img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.18s ease;   /* shown only once it really loads */
  }
  .poster-slot img.ok { opacity: 1; }
  .row-text { flex: 1; min-width: 0; }
  /* inline so the click target is the words themselves and not the whole line;
     break-anywhere so a long single word can never push into the controls */
  .row-title {
    display: inline; color: inherit;
    font-weight: 800; font-size: 1.05rem; line-height: 1.25; overflow-wrap: anywhere;
    text-decoration: underline; text-decoration-thickness: 0.13rem;
    text-decoration-color: var(--underline); text-underline-offset: 0.2rem;
  }
  .row-title:hover { color: var(--mid); text-decoration-color: var(--orange); }
  .row-sub { display: block; font-size: 0.79rem; font-weight: 600; color: var(--text-soft); margin-top: 4px; }
  .row-right { display: flex; align-items: center; gap: 0.5rem; flex: none; }
  /* Both badges are circles of a fixed size rather than text with padding, so a
     two-digit 10 stays as round as a single-digit 8. */
  .pill {
    width: var(--badge); height: var(--badge); flex: none;
    border: 0.13rem solid var(--edge); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem; font-weight: 800;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  }
  .pill.good { background: var(--good-lo); color: var(--good); }
  .pill.mid  { background: var(--mid-lo);  color: var(--mid); }
  .pill.bad  { background: var(--bad-lo);  color: var(--bad); }
  .pill.none {
    background: var(--grey-lo); color: var(--grey);
    font-family: Nunito, sans-serif; font-size: 0.63rem; letter-spacing: 0;
  }
  .vod-dot {
    width: var(--dot); height: var(--dot); border-radius: 50%; flex: none;
    border: 0.13rem solid var(--edge); background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .vod-dot svg { width: 0.72rem; height: 0.72rem; }
  .chev { color: var(--text-soft); flex: none; display: flex; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .chev svg { width: 1rem; height: 1rem; }
  .row.open .chev { transform: rotate(90deg); }

  /* Animating max-height meant guessing a ceiling and racing to it: a row with
     one link shot open and then sat still for the rest of the transition, and on
     the way back nothing moved until the ceiling came down to meet the content.
     A grid row from 0fr to 1fr travels the content's real height instead, so
     every row takes the same time regardless of how much is inside. */
  .reveal {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .row.open .reveal { grid-template-rows: 1fr; }
  /* the clipper carries no padding of its own: padding sits outside the content
     box that overflow hides, so a padded grid item never collapses to nothing */
  .reveal-clip { overflow: hidden; min-height: 0; }
  .reveal-in {
    padding: 0.13rem 0.13rem 0.9rem 7.9rem;
    display: flex; flex-direction: column; gap: 0.45rem;
    opacity: 0; transition: opacity 0.22s ease;
  }
  .row.open .reveal-in { opacity: 1; }
  .vod-link {
    border: 0.13rem solid var(--edge); border-radius: var(--r-mid); corner-shape: superellipse(1.6);
    background: var(--surface-2); padding: 0.5rem 0.7rem;
    display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.85rem; color: var(--text);
  }
  .vod-link:hover { background: var(--orange-lo); }
  .vod-link svg { width: 0.85rem; height: 0.85rem; flex: none; color: var(--orange); }
  .vod-link .lab { flex: 1; min-width: 0; }
  .no-vod { font-size: 0.85rem; font-weight: 700; color: var(--text-soft); }

  /* ---------- tiles ---------- */
  .grid {
    list-style: none; margin: 1rem 0 0; padding: 0;
    /* The column count is stepped by hand rather than left to auto-fill, and it
       stops at six: past that a wide monitor should be making the covers bigger,
       not fitting more of them in. */
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.62rem;
  }
  @media (min-width: 500px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 760px)  { .grid { grid-template-columns: repeat(4, 1fr); gap: 0.9rem; } }
  @media (min-width: 1060px) { .grid { grid-template-columns: repeat(5, 1fr); } }
  @media (min-width: 1320px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  /* a turning card leans out of its cell — it has to paint above its neighbours */
  .tile { position: relative; display: flex; flex-direction: column; gap: 0.45rem; min-width: 0; }
  .tile.open { z-index: 2; }
  /* The tile is a card with two sides that turns as one object, frame included.
     .tile-art only holds the 3D space and must NOT clip: an overflow here would
     shave off the corners of the card exactly while they swing out of the flat
     plane, which read as the cover vanishing mid-turn. Each face carries its own
     border and rounding instead, so the frame travels with the card. */
  .tile-art {
    position: relative; width: 100%; aspect-ratio: 2 / 3; cursor: pointer;
    perspective: 62rem;
  }
  .flip {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tile.open .flip { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; overflow: hidden;
    border: 0.13rem solid var(--edge);
    border-radius: var(--r-mid); corner-shape: superellipse(1.6);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .tile-front {
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 2.6rem; color: #fff; text-shadow: 0 0.13rem 0 rgba(0,0,0,0.35);
  }
  .face img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.18s ease;
  }
  .face img.ok { opacity: 1; }
  /* text-shadow: the drop shadow belongs to the big letter behind the cover, but
     it inherits into the badge and smears its digits, so it is cancelled here */
  .tile-front .pill { position: absolute; top: 0.4rem; right: 0.4rem; z-index: 1; text-shadow: none; }
  .tile-dot { position: absolute; top: 0.4rem; left: 0.4rem; z-index: 1; }
  /* The reverse keeps the same cover, darkened, so the card never turns into a
     blank slab — and the recordings scroll over it when there are several. */
  .tile-back {
    transform: rotateY(180deg);
    color: #fff; text-shadow: none; font-size: 1rem; font-weight: 400;
    /* Hidden until its card is actually turned. Eighty-four reverse sides, each
       a composited 3D layer with its own cover to decode, is what made the
       switch into the shelf stutter; hidden ones are neither painted nor
       fetched. The delay keeps the back present for the whole closing turn. */
    visibility: hidden; transition: visibility 0s linear 0.55s;
  }
  .tile.open .tile-back { visibility: visible; transition-delay: 0s; }
  .tile-back::after {
    content: ""; position: absolute; inset: 0;
    background: rgba(8,6,6,0.66); pointer-events: none;
  }
  .tile-vods {
    position: absolute; inset: 0; z-index: 1; overflow: auto;
    padding: 0.45rem; gap: 0.4rem;
    display: flex; flex-direction: column;
  }
  .tile-vods .vod-link { padding: 0.4rem 0.5rem; font-size: 0.76rem; }
  .tile-vods .no-vod { font-size: 0.78rem; color: #efe4d7; }
  .tile-title {
    display: block; font-weight: 800; font-size: 0.9rem; line-height: 1.2; overflow-wrap: anywhere;
    text-decoration: underline; text-decoration-thickness: 0.13rem;
    text-decoration-color: var(--underline); text-underline-offset: 0.2rem;
  }
  .tile-title:hover { color: var(--mid); text-decoration-color: var(--orange); }

  .empty { text-align: center; padding: 1.6rem 0.6rem; color: var(--text-soft); font-weight: 700; }
  .snap {
    margin-top: 0.9rem; padding-top: 0.75rem; border-top: 0.13rem solid var(--line);
    font-size: 0.76rem; font-weight: 600; color: var(--text-soft); line-height: 1.45;
  }
  .snap a { font-weight: 800; text-decoration: underline; color: var(--orange); }

  /* ---------- motion between states ---------- */
  /* The two themes are one palette swapped by role, so the swap can travel
     instead of snapping. It is armed only for the moment of the change, so it
     costs nothing the rest of the time — and it names the surfaces rather than
     every descendant: putting it on all ~700 elements inside the card cost more
     in style recalculation than the fade was worth (measured: 17 frames against
     26). Text that merely inherits its colour follows the card for free, and the
     poster frames are left out on purpose: only their thin border changes, and
     paying for 168 of them cost a third of the frame rate in the shelf. */
  #app.theming .card, #app.theming .card > .head,
  #app.theming .search-wrap input, #app.theming .search-wrap > svg,
  #app.theming .search-clear, #app.theming .chip, #app.theming .tool,
  #app.theming .row, #app.theming .pill,
  #app.theming .vod-dot, #app.theming .vod-link,
  #app.theming .no-vod, #app.theming .empty, #app.theming .snap {
    transition: background-color 0.22s ease, color 0.22s ease,
                border-color 0.22s ease, text-decoration-color 0.22s ease;
  }

  /* Switching between the list and the shelf replaces every element at once.
     The class is only put on the freshly built container when the view actually
     changed, so typing in the search box does not replay this. */
  @keyframes swap-in {
    from { opacity: 0; transform: translateY(0.55rem); }
  }
  /* Only the first screenful animates. Running this on all 84 items while the
     card is also re-laying itself out is what made the switch stutter; the rest
     are below the fold and nobody sees them arrive. */
  .swap > :nth-child(-n+20) {
    animation: swap-in 0.2s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    animation-delay: calc(var(--i, 0) * 8ms);
  }

  /* ---------- back to top ---------- */
  /* a watermelon wedge, point up — the SVG carries the whole look, so the
     button itself is just a transparent hit area */
  #up {
    position: fixed; right: 1.15rem; bottom: 1.15rem; z-index: 20;
    width: 4rem; height: 4rem; padding: 0;
    border: none; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 0.3rem 0 rgba(0,0,0,0.5));
    opacity: 0; transform: translateY(0.9rem) scale(0.9); pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #up.show { opacity: 1; transform: none; pointer-events: auto; }
  #up:hover { transform: translateY(-0.19rem); }
  #up:active { transform: translateY(0.19rem); filter: drop-shadow(0 0.06rem 0 rgba(0,0,0,0.5)); }
  #up svg { width: 100%; height: 100%; display: block; }

  @media (max-width: 620px) {
    /* the row has far less width to spend here than on a desktop */
    :root { --badge: 2.05rem; --dot: 1.8rem; }
    .shell { padding-top: 3.6rem; }
    .card > .head { padding: 0.75rem 0.9rem 0.75rem 9.25rem; min-height: 3.5rem; }
    /* the panda eats the left half of the header, so what is left for the title
       scales with the screen rather than sitting at one fixed size */
    h1 { font-size: clamp(0.9rem, 4.6vw, 1.4rem); }
    .panda { width: 9.25rem; top: -2.06rem; left: -0.75rem; }
    .poster-slot { width: 4.4rem; height: 6.6rem; font-size: 1.7rem; }
    .reveal-in { padding-left: 5.3rem; }
    .row-main { gap: 0.7rem; }
    /* the № is the sheet's own numbering — least useful thing to keep when the
       text column gets squeezed */
    .row-num { display: none; }
    .row-title { font-size: 0.98rem; }
    .tile-front { font-size: 2rem; }
    .tile-title { font-size: 0.82rem; }
    #up { right: 0.75rem; bottom: 0.75rem; width: 3rem; height: 3rem; }
  }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<button id="up" aria-label="Наверх" title="Наверх">
  <!-- Rind only along the cut's curved edge, as on a real slice: the flesh fills
       the wedge and the rind bands are clipped to it, so the straight sides stay
       bare. -->
  <svg viewBox="0 0 100 100" role="img" aria-hidden="true">
    <defs>

    </defs>

    </g>
    <path d="M50 6 L94 86 Q50 105 6 86 Z" fill="none" stroke="#24310f" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="50" cy="42" rx="3.3" ry="4.8" fill="#2a1710"/>
    <ellipse cx="38" cy="58" rx="3.3" ry="4.8" fill="#2a1710" transform="rotate(-14 38 58)"/>
    <ellipse cx="62" cy="58" rx="3.3" ry="4.8" fill="#2a1710" transform="rotate(14 62 58)"/>
  </svg>
</button>

      ? { icon: grid ? I.rows : I.grid, label: grid ? "Показать списком" : "Показать плиткой" }
      : { icon: dark ? I.sun : I.moon, label: dark ? "Светлая тема" : "Тёмная тема" };
    return '<button class="tool" id="t-' + kind + '" aria-label="' + b.label + '" title="' + b.label + '">' +
      b.icon + "</button>";
  }

  function applyTheme() {
    document.getElementById("app").setAttribute("data-theme", ui.theme);
  }

  function render() {
    // set before the markup lands, so the card is never laid out at one width
    // and repainted at the other
    document.getElementById("app").setAttribute("data-view", ui.view);
    var l = list();
    var sorts = [{ f: "n", label: "По порядку" }, { f: "r", label: "Оценка" }, { f: "t", label: "Название" }];

    var html = '<div class="card"><img class="panda" src="' + PANDA + '" alt="">' +
      '<div class="head"><h1>Что смотрела Ред_Шпрондаа</h1></div>' +
      '<div class="body">' +
      '<div class="search-wrap">' + I.search +
      '<input type="search" id="q" placeholder="Поиск по фильмам" value="' + esc(ui.search) + '">' +
      (ui.search ? '<button class="search-clear" id="q-clear" aria-label="Очистить">✕</button>' : "") +
      "</div>" +
      '<div class="chipbar">' +
      sorts.map(function (it) {
        var on = it.f === ui.sort;
        return '<button class="chip' + (on ? " on" : "") + '" data-sort="' + it.f + '">' + esc(it.label) +
          (on ? '<span class="arr">' + (ui.dir === 1 ? "▲" : "▼") + "</span>" : "") + "</button>";
      }).join("") +
      '<span class="tools">' + toolBtn("view") + toolBtn("theme") + "</span></div>" +
      (l.length
        ? '<ul class="' + (ui.view === "grid" ? "grid" : "rows") + (swapping ? " swap" : "") + '">' +
          l.map(ui.view === "grid" ? tile : row).join("") + "</ul>" 
        : '<div class="empty">Ничего не нашлось по запросу «' + esc(ui.search) + "»</div>") +
      '<div class="snap">Собрано из таблицы — снимок от ' + esc(SHEET_SYNCED) +
      '. <a href="' + esc(SHEET_URL) + '" target="_blank" rel="noopener noreferrer">Открыть таблицу</a></div>' +
      "</div></div>";

    document.getElementById("app").innerHTML = html;
    attach();
    bindPosters();
  }

  function on(sel, fn) {
    document.querySelectorAll(sel).forEach(function (el) { el.addEventListener("click", fn); });
  }

  // Opening a row used to re-render the whole list, which threw away every <img>
  // and made all the covers blink back to their letter. Nothing needs rebuilding
  // here — only which element carries .open changes.
  function setOpen(n) {
    ui.open = ui.open === n ? null : n;
    document.querySelectorAll("[data-open]").forEach(function (el) {
      var mine = parseInt(el.getAttribute("data-open"), 10) === ui.open;
      el.setAttribute("aria-expanded", mine ? "true" : "false");
      var holder = el.closest(".row, .tile");
      if (holder) holder.classList.toggle("open", mine);
    });
  }

  function attach() {
    on("[data-open]", function (e) {
      setOpen(parseInt(e.currentTarget.getAttribute("data-open"), 10));
    });
    // links living inside a clickable row must navigate without toggling it
    on("a.row-title, .tile-vods a", function (e) { e.stopPropagation(); });
    document.querySelectorAll('[data-open][role="button"]').forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); el.click(); }
      });
    });

    on("[data-sort]", function (e) {
      var f = e.currentTarget.getAttribute("data-sort");
      if (ui.sort === f) ui.dir *= -1; else { ui.sort = f; ui.dir = f === "r" ? -1 : 1; }
      render();
    });

    var q = document.getElementById("q");
    if (q) q.addEventListener("input", function (e) {
      ui.search = e.target.value;
      render();
      var again = document.getElementById("q");
      if (again) { again.focus(); again.selectionStart = again.selectionEnd = again.value.length; }
    });
    var clr = document.getElementById("q-clear");
    if (clr) clr.addEventListener("click", function () { ui.search = ""; render(); });

    // The card stretches and the two lists cross-fade over the top of it.
    // Pinning the outgoing list to its pixel width first is what keeps the
    // stretch smooth: left free, all 84 items re-lay-out on every frame, which
    // measured 8 frames against 25. The rebuild is timed to land while the old
    // list has faded but the stretch is still finishing, so the card is never
    // seen empty and the arriving items cover the last of the movement.
    on("#t-view", function () {
      ui.view = ui.view === "grid" ? "list" : "grid";
      store.set("view", ui.view);
      swapping = true;
      render();
      swapping = false;
    });
    // only the palette and this button's own icon change, so the list stays put
    on("#t-theme", function flip(e) {
      ui.theme = ui.theme === "dark" ? "light" : "dark";
      store.set("theme", ui.theme);
      var app = document.getElementById("app");
      app.classList.add("theming");
      clearTimeout(themeOff);
      themeOff = setTimeout(function () { app.classList.remove("theming"); }, 280);
      applyTheme();
      e.currentTarget.outerHTML = toolBtn("theme");
      on("#t-theme", flip);
    });
  }

  function initUp() {
    var up = document.getElementById("up");
    if (!up) return;
    function sync() { up.classList.toggle("show", window.scrollY > 360); }
    window.addEventListener("scroll", sync, { passive: true });
    up.addEventListener("click", function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });
    sync();
  }

  applyTheme();
  render();
  initUp();
})();
</script>
</body>
</html>
