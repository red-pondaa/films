<style>
  /* A dark bamboo wall with a sticker card on it. The wall stays dark in both
     themes — only the card flips, so the two modes are one palette swapped by
     role, never a second set of rules. */
  :root {
    --ground: #0e0e10;
    --panel: #9a467e;

    --stroke: 3px;
    --drop: 0 6px 0 rgba(0,0,0,0.55);

    /* Corners: a gentle squircle. border-radius is the fallback everywhere;
       corner-shape refines it to a superellipse where the browser knows it. */
    --r-card: 20px;
    --r-mid: 12px;
    --r-small: 9px;
  }

  /* The theme attribute lives on #app, not on the root: the artifact viewer
     stamps its own data-theme on the root element, and this would fight it. */
  #app {
    --surface: #fbf3e6;    /* the card */
    --surface-2: #fff;     /* inputs, chips, links sitting on the card */
    --text: #3e1616;
    --text-soft: #6d4038;
    --edge: #3e1616;       /* every thick sticker outline */
    --chip-on-bg: #3e1616; --chip-on-fg: #fbf3e6;
    --line: var(--line);
    --underline: var(--underline);
    --dot-off: var(--dot-off);

    --orange: #e07a00;  --orange-lo: #faeed9;
    --good: #2f7d3a; --good-lo: #d8f0d4;
    --mid:  #a35c00; --mid-lo:  #fbe8c8;
    --bad:  #b3271e; --bad-lo:  #fadcd8;
    --grey: #6d6257; --grey-lo: #e8e0d2;
  }
  #app[data-theme="dark"] {
    --surface: #241d1c;
    --surface-2: #322827;
    --text: #f3e7d9;
    --text-soft: #b6a091;
    /* warmer and lighter than the card, so the outline still reads as an outline
       against both the card and the near-black bamboo behind it */
    --edge: #5b4741;
    --chip-on-bg: #f3e7d9; --chip-on-fg: #241d1c;
    --line: rgba(243,231,217,0.14);
    --underline: rgba(243,231,217,0.26);
    --dot-off: #4a3c39;

    --orange: #f09a3c;  --orange-lo: #3a2c1c;
    --good: #8fd39a; --good-lo: #24382a;
    --mid:  #e9b96a; --mid-lo:  #3a2e1c;
    --bad:  #f0918a; --bad-lo:  #3d2422;
    --grey: #a3948a; --grey-lo: #322a28;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #f3e7d9;
    font-family: Nunito, "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* a light vignette: settles the busy wall down without hiding the bamboo */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(1100px 760px at 50% 8%, rgba(8,10,8,0.10), rgba(5,7,5,0.55) 78%);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; }
  :focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }

  .shell { max-width: 700px; margin: 0 auto; padding: 74px 16px 90px; position: relative; z-index: 1; }

  /* ---------- one whole card: the panda lies on its top edge ---------- */
  .card {
    position: relative;
    border: var(--stroke) solid var(--edge);
    border-radius: var(--r-card);
    corner-shape: superellipse(1.6);
    background: var(--surface);
    box-shadow: var(--drop);
    color: var(--text);
  }
  .card > .head {
    background: var(--panel);
    border-bottom: var(--stroke) solid var(--edge);
    border-radius: calc(var(--r-card) - var(--stroke)) calc(var(--r-card) - var(--stroke)) 0 0;
    corner-shape: superellipse(1.6);
    padding: 16px 18px 16px 196px;
    min-height: 68px;
    display: flex; align-items: center;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }
  .card > .body { padding: 16px 18px 18px; }
  .panda {
    position: absolute;
    /* Her underside's highest point is 43.5% down the art (70px of 161). At
       this width that lands ~4px below the card's top edge, so she overlaps the
       edge instead of meeting it and no background can show through under her. */
    left: -15px; top: -42px;
    width: 186px; height: auto;
    z-index: 3; pointer-events: none;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.4));
  }
  /* break-anywhere is the safety net: the name is one long unbreakable word, and
     without it a narrow screen would be pushed into horizontal scrolling */
  h1 { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.01em; overflow-wrap: anywhere; }

  .search-wrap { position: relative; display: flex; align-items: center; color: var(--orange); }
  .search-wrap > svg { position: absolute; left: 13px; width: 16px; height: 16px; color: var(--text-soft); pointer-events: none; }
  .search-wrap input {
    width: 100%; border: 2px solid var(--edge); border-radius: 999px; background: var(--surface-2); color: var(--text);
    padding: 9px 40px 9px 36px; font-size: 0.95rem; font-family: inherit; font-weight: 600;
  }
  .search-wrap input::placeholder { color: var(--text-soft); font-weight: 600; }
  .search-wrap input:focus { outline: none; box-shadow: inset 0 0 0 2px currentColor; }
  .search-clear {
    position: absolute; right: 8px; border: none; background: var(--chip-on-bg); color: var(--chip-on-fg);
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 0.78rem;
    display: flex; align-items: center; justify-content: center;
  }
  .chipbar { display: flex; align-items: center; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  .chipbar .lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); }
  .chip {
    border: 2px solid var(--edge); border-radius: var(--r-small);
    corner-shape: superellipse(1.6);
    background: var(--surface-2); color: var(--text);
    padding: 4px 11px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.on { background: var(--chip-on-bg); color: var(--chip-on-fg); }
  .chip .arr { font-size: 0.7em; }

  /* view + theme switches: pushed to the far end of the sort row, so on a narrow
     screen they wrap onto their own line instead of squeezing the chips */
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .tool {
    width: 30px; height: 30px; padding: 0; cursor: pointer;
    border: 2px solid var(--edge); border-radius: var(--r-small);
    corner-shape: superellipse(1.6);
    background: var(--surface-2); color: var(--text);
    display: flex; align-items: center; justify-content: center;
  }
  .tool:hover { background: var(--orange-lo); }
  .tool svg { width: 15px; height: 15px; }

  /* ---------- rows ---------- */
  .rows { list-style: none; margin: 16px 0 0; padding: 0; }
  .row { border-top: 2px solid var(--line); }
  .row:first-child { border-top: none; }
  .row-main {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 13px 2px;
    border: none; background: none; text-align: left; cursor: pointer; color: var(--text); font-family: inherit;
  }
  .row-num {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums;
    font-size: 0.75rem; font-weight: 700;
    color: var(--text-soft); min-width: 2.1em; flex: none; text-align: right;
  }
  /* Poster slot: the letter is painted underneath, and the cover art — when it
     loads — sits on top. Where external images are blocked (the artifact
     viewer's CSP) the image never appears and the letter simply stays. */
  .poster-slot {
    width: 96px; height: 144px; flex: none;
    border: 2px solid var(--edge);
    border-radius: var(--r-mid); corner-shape: superellipse(1.6);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 2.3rem; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .poster-slot img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.18s ease;   /* shown only once it really loads */
  }
  .poster-slot img.ok { opacity: 1; }
  .row-text { flex: 1; min-width: 0; }
  /* inline so the click target is the words themselves and not the whole line;
     break-anywhere so a long single word can never push into the controls */
  .row-title {
    display: inline; color: inherit;
    font-weight: 800; font-size: 1.05rem; line-height: 1.25; overflow-wrap: anywhere;
    text-decoration: underline; text-decoration-thickness: 2px;
    text-decoration-color: var(--underline); text-underline-offset: 3px;
  }
  .row-title:hover { color: var(--mid); text-decoration-color: var(--orange); }
  .row-sub { display: block; font-size: 0.79rem; font-weight: 600; color: var(--text-soft); margin-top: 4px; }
  .row-right { display: flex; align-items: center; gap: 7px; flex: none; }
  .pill {
    border: 2px solid var(--edge); border-radius: 999px; padding: 2px 8px;
    font-size: 0.79rem; font-weight: 800; font-family: "JetBrains Mono", monospace;
    flex: none; text-align: center; min-width: 45px;
  }
  .pill.good { background: var(--good-lo); color: var(--good); }
  .pill.mid  { background: var(--mid-lo);  color: var(--mid); }
  .pill.bad  { background: var(--bad-lo);  color: var(--bad); }
  .pill.none { background: var(--grey-lo); color: var(--grey); font-family: Nunito, sans-serif; font-size: 0.72rem; }
  .vod-dot {
    width: 23px; height: 23px; border-radius: 50%; flex: none;
    border: 2px solid var(--edge); background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .vod-dot svg { width: 10px; height: 10px; }
  /* NB: modifier is .off — .empty is the empty-result block, whose padding would
     stretch this dot into an oval. */
  .vod-dot.off { background: var(--dot-off); color: var(--text-soft); }
  .chev { color: var(--text-soft); flex: none; display: flex; transition: transform 0.22s ease; }
  .chev svg { width: 15px; height: 15px; }
  .row.open .chev { transform: rotate(90deg); }

  .reveal { overflow: hidden; max-height: 0; transition: max-height 0.26s ease; }
  .row.open .reveal { max-height: 340px; }
  .reveal-in { padding: 2px 2px 14px 126px; display: flex; flex-direction: column; gap: 7px; }
  .vod-link {
    border: 2px solid var(--edge); border-radius: var(--r-mid); corner-shape: superellipse(1.6);
    background: var(--surface-2); padding: 8px 11px;
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; color: var(--text);
  }
  .vod-link:hover { background: var(--orange-lo); }
  .vod-link svg { width: 13px; height: 13px; flex: none; color: var(--orange); }
  .vod-link .lab { flex: 1; min-width: 0; }
  .no-vod { font-size: 0.85rem; font-weight: 700; color: var(--text-soft); }

  /* ---------- tiles ---------- */
  .grid {
    list-style: none; margin: 16px 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 14px;
  }
  .tile { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .tile-art {
    position: relative; width: 100%; aspect-ratio: 2 / 3; cursor: pointer;
    border: 2px solid var(--edge);
    border-radius: var(--r-mid); corner-shape: superellipse(1.6);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 2.6rem; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .tile-art img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.18s ease;
  }
  .tile-art img.ok { opacity: 1; }
  .tile-art .pill { position: absolute; top: 6px; right: 6px; z-index: 1; min-width: 0; padding: 1px 7px; font-size: 0.72rem; }
  .tile-dot {
    position: absolute; top: 6px; left: 6px; z-index: 1;
    width: 21px; height: 21px; border-radius: 50%;
    border: 2px solid var(--edge); background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-dot svg { width: 9px; height: 9px; }
  /* the recordings open over the poster itself — a grid has no room to expand a
     row underneath without shoving every later tile around */
  .tile-vods {
    position: absolute; inset: 0; z-index: 2; padding: 7px; gap: 6px;
    background: var(--surface); color: var(--text); text-shadow: none;
    font-size: 1rem; font-weight: 400;
    display: none; flex-direction: column; overflow: auto;
  }
  .tile.open .tile-vods { display: flex; }
  .tile-vods .vod-link { padding: 6px 8px; font-size: 0.76rem; }
  .tile-vods .no-vod { font-size: 0.78rem; }
  .tile-title {
    display: block; font-weight: 800; font-size: 0.9rem; line-height: 1.2; overflow-wrap: anywhere;
    text-decoration: underline; text-decoration-thickness: 2px;
    text-decoration-color: var(--underline); text-underline-offset: 3px;
  }
  .tile-title:hover { color: var(--mid); text-decoration-color: var(--orange); }

  .empty { text-align: center; padding: 26px 10px; color: var(--text-soft); font-weight: 700; }
  .snap {
    margin-top: 14px; padding-top: 12px; border-top: 2px solid var(--line);
    font-size: 0.76rem; font-weight: 600; color: var(--text-soft); line-height: 1.45;
  }
  .snap a { font-weight: 800; text-decoration: underline; color: var(--orange); }

  /* ---------- back to top ---------- */
  /* a watermelon wedge, point up — the SVG carries the whole look, so the
     button itself is just a transparent hit area */
  #up {
    position: fixed; right: 18px; bottom: 18px; z-index: 20;
    width: 64px; height: 64px; padding: 0;
    border: none; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 5px 0 rgba(0,0,0,0.5));
    opacity: 0; transform: translateY(14px) scale(0.9); pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #up.show { opacity: 1; transform: none; pointer-events: auto; }
  #up:hover { transform: translateY(-3px); }
  #up:active { transform: translateY(3px); filter: drop-shadow(0 1px 0 rgba(0,0,0,0.5)); }
  #up svg { width: 100%; height: 100%; display: block; }

  @media (max-width: 620px) {
    .shell { padding-top: 58px; }
    .card > .head { padding: 12px 14px 12px 148px; min-height: 56px; }
    /* the panda eats the left half of the header, so what is left for the title
       scales with the screen rather than sitting at one fixed size */
    h1 { font-size: clamp(0.85rem, 4.2vw, 1.22rem); }
    .panda { width: 148px; top: -33px; left: -12px; }
    .poster-slot { width: 70px; height: 105px; font-size: 1.7rem; }
    .reveal-in { padding-left: 82px; }
    .row-main { gap: 11px; }
    /* the № is the sheet's own numbering — least useful thing to keep when the
       text column gets squeezed */
    .row-num { display: none; }
    .row-title { font-size: 0.98rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(102px, 1fr)); gap: 10px; }
    .tile-art { font-size: 2rem; }
    .tile-title { font-size: 0.82rem; }
    #up { right: 12px; bottom: 12px; width: 48px; height: 48px; }
  }
</style>
</head>
<body>
<div class="shell" id="app"></div>
<button id="up" aria-label="Наверх" title="Наверх">
  <!-- Rind only along the cut's curved edge, as on a real slice: the flesh fills
       the wedge and the rind bands are clipped to it, so the straight sides stay
       bare. -->
  <svg viewBox="0 0 100 100" role="img" aria-hidden="true">
    <defs>

      <path d="M-4 86 Q50 104 104 86 L104 104 Q50 122 -4 104 Z" fill="#2f6b28"/>

    <path d="M50 6 L94 86 Q50 105 6 86 Z" fill="none" stroke="#24310f" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="50" cy="42" rx="3.3" ry="4.8" fill="#2a1710"/>
    <ellipse cx="38" cy="58" rx="3.3" ry="4.8" fill="#2a1710" transform="rotate(-14 38 58)"/>

</button>

        var on = it.f === ui.sort;
        return '<button class="chip' + (on ? " on" : "") + '" data-sort="' + it.f + '">' + esc(it.label) +
          (on ? '<span class="arr">' + (ui.dir === 1 ? "▲" : "▼") + "</span>" : "") + "</button>";
      }).join("") +
      '<span class="tools">' + toolBtn("view") + toolBtn("theme") + "</span></div>" +
      (l.length
        ? (ui.view === "grid" ? '<ul class="grid">' + l.map(tile).join("") + "</ul>"
                              : '<ul class="rows">' + l.map(row).join("") + "</ul>")
        : '<div class="empty">Ничего не нашлось по запросу «' + esc(ui.search) + "»</div>") +
      '<div class="snap">Собрано из таблицы — снимок от ' + esc(SHEET_SYNCED) +
      '. <a href="' + esc(SHEET_URL) + '" target="_blank" rel="noopener noreferrer">Открыть таблицу</a></div>' +
      "</div></div>";

    document.getElementById("app").innerHTML = html;
    attach();
    bindPosters();
  }

  function on(sel, fn) {
    document.querySelectorAll(sel).forEach(function (el) { el.addEventListener("click", fn); });
  }

  // Opening a row used to re-render the whole list, which threw away every <img>
  // and made all the covers blink back to their letter. Nothing needs rebuilding
  // here — only which element carries .open changes.
  function setOpen(n) {
    ui.open = ui.open === n ? null : n;
    document.querySelectorAll("[data-open]").forEach(function (el) {
      var mine = parseInt(el.getAttribute("data-open"), 10) === ui.open;
      el.setAttribute("aria-expanded", mine ? "true" : "false");
      var holder = el.closest(".row, .tile");
      if (holder) holder.classList.toggle("open", mine);
    });
  }

  function attach() {
    on("[data-open]", function (e) {
      setOpen(parseInt(e.currentTarget.getAttribute("data-open"), 10));
    });
    // links living inside a clickable row must navigate without toggling it
    on("a.row-title, .tile-vods a", function (e) { e.stopPropagation(); });
    document.querySelectorAll('[data-open][role="button"]').forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); el.click(); }
      });
    });

    on("[data-sort]", function (e) {
      var f = e.currentTarget.getAttribute("data-sort");
      if (ui.sort === f) ui.dir *= -1; else { ui.sort = f; ui.dir = f === "r" ? -1 : 1; }
      render();
    });

    var q = document.getElementById("q");
    if (q) q.addEventListener("input", function (e) {
      ui.search = e.target.value;
      render();
      var again = document.getElementById("q");
      if (again) { again.focus(); again.selectionStart = again.selectionEnd = again.value.length; }
    });
    var clr = document.getElementById("q-clear");
    if (clr) clr.addEventListener("click", function () { ui.search = ""; render(); });

    on("#t-view", function () {
      ui.view = ui.view === "grid" ? "list" : "grid";
      store.set("view", ui.view);
      render();
    });
    // only the palette and this button's own icon change, so the list stays put
    on("#t-theme", function flip(e) {
      ui.theme = ui.theme === "dark" ? "light" : "dark";
      store.set("theme", ui.theme);
      applyTheme();
      e.currentTarget.outerHTML = toolBtn("theme");
      on("#t-theme", flip);
    });
  }

  function initUp() {
    var up = document.getElementById("up");
    if (!up) return;
    function sync() { up.classList.toggle("show", window.scrollY > 360); }
    window.addEventListener("scroll", sync, { passive: true });
    up.addEventListener("click", function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });
    sync();
  }

  applyTheme();
  render();
  initUp();
})();
</script>
</body>
</html>
