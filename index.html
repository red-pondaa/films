<style>
  /* One committed visual world: a dark bamboo wall with a cream sticker card on
     it. Every colour is painted explicitly — there is no light/dark swap. */
  :root {
    --ground: #0e0e10;
    --ink: #3e1616;
    --ink-soft: #6d4038;
    --cream: #fbf3e6;

    --purple: #9a467e;
    --orange: #e07a00;  --orange-lo: #faeed9;

    --good: #2f7d3a; --good-lo: #d8f0d4;
    --mid:  #a35c00; --mid-lo:  #fbe8c8;
    --bad:  #b3271e; --bad-lo:  #fadcd8;
    --grey: #6d6257; --grey-lo: #e8e0d2;

    --stroke: 3px;
    --drop: 0 6px 0 rgba(0,0,0,0.55);
    --drop-sm: 0 3px 0 rgba(0,0,0,0.5);

    /* Corners: a gentle squircle. border-radius is the fallback everywhere;
       corner-shape refines it to a superellipse where the browser knows it. */
    --r-card: 20px;
    --r-mid: 12px;
    --r-small: 9px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }

    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--cream);
    font-family: Nunito, "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* a light vignette: settles the busy wall down without hiding the bamboo */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(1100px 760px at 50% 8%, rgba(8,10,8,0.10), rgba(5,7,5,0.55) 78%);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }

  .shell { max-width: 700px; margin: 0 auto; padding: 74px 16px 90px; position: relative; z-index: 1; }

  /* ---------- one whole card: the panda lies on its top edge ---------- */
  .card {
    position: relative;
    border: var(--stroke) solid var(--ink);
    border-radius: var(--r-card);
    corner-shape: superellipse(1.6);
    background: var(--cream);
    box-shadow: var(--drop);
    color: var(--ink);
  }
  .card > .head, .card > .body { position: relative; }
  .card > .head {
    background: var(--purple);
    border-bottom: var(--stroke) solid var(--ink);
    border-radius: calc(var(--r-card) - var(--stroke)) calc(var(--r-card) - var(--stroke)) 0 0;
    corner-shape: superellipse(1.6);
    padding: 16px 18px 16px 196px;
    min-height: 68px;
    display: flex; align-items: center;
    color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3);
  }
  .card > .body {
    padding: 16px 18px 18px;
    border-radius: 0 0 calc(var(--r-card) - var(--stroke)) calc(var(--r-card) - var(--stroke));
  }
  .panda {
    position: absolute;
    /* tucked into the panel's top-left corner: nothing overhangs into empty
       space, and her underside rests on the purple band */
    /* The underside's highest point is 40% down the art, so the card's edge sits
       just above it — she overlaps the edge instead of meeting it, and no
       background can show through under her. */
    left: -15px; top: -40px;
    width: 186px; height: auto;
    z-index: 3; pointer-events: none;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.4));
  }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.01em; }

  .search-wrap { position: relative; display: flex; align-items: center; color: var(--orange); }
  .search-wrap > svg { position: absolute; left: 13px; width: 16px; height: 16px; color: var(--ink-soft); pointer-events: none; }
  .search-wrap input {
    width: 100%; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink);
    padding: 9px 40px 9px 36px; font-size: 0.95rem; font-family: inherit; font-weight: 600;
  }
  .search-wrap input::placeholder { color: var(--ink-soft); font-weight: 600; }
  .search-wrap input:focus { outline: none; box-shadow: inset 0 0 0 2px currentColor; }
  .search-clear {
    position: absolute; right: 8px; border: none; background: var(--ink); color: var(--cream);
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 0.78rem;
    display: flex; align-items: center; justify-content: center;
  }
  .chipbar { display: flex; align-items: center; gap: 6px; margin-top: 11px; flex-wrap: wrap; }
  .chipbar .lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .chip {
    border: 2px solid var(--ink); border-radius: var(--r-small);
    corner-shape: superellipse(1.6);
    background: #fff; color: var(--ink);
    padding: 4px 11px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.on { background: var(--ink); color: var(--cream); }
  .chip .arr { font-size: 0.7em; }

  /* ---------- rows ---------- */
  .rows { list-style: none; margin: 16px 0 0; padding: 0; }
  .row { border-top: 2px solid rgba(62,22,22,0.16); }
  .row:first-child { border-top: none; }
  .row-main {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 13px 2px;
    border: none; background: none; text-align: left; cursor: pointer; color: var(--ink); font-family: inherit;
  }
  .row-num {
    font-family: "JetBrains Mono", monospace; font-size: 0.75rem; font-weight: 700;
    color: var(--ink-soft); min-width: 2.1em; flex: none; text-align: right;
  }
  /* Poster slot: the letter is painted underneath, and the cover art — when it
     loads — sits on top. Where external images are blocked (the artifact
     viewer's CSP) the image never appears and the letter simply stays. */
  .poster-slot {
    width: 96px; height: 144px; flex: none;
    border: 2px solid var(--ink);
    border-radius: var(--r-mid); corner-shape: superellipse(1.6);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 2.3rem; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .poster-slot img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.18s ease;   /* shown only once it really loads */
  }
  .poster-slot img.ok { opacity: 1; }
  .row-text { flex: 1; min-width: 0; }
  /* break-anywhere so a long single word can never push into the controls */
  .row-title { display: block; font-weight: 800; font-size: 1.05rem; line-height: 1.25; overflow-wrap: anywhere; }
  /* inline so the click target is the words themselves, not the whole line */
  a.row-title {
    display: inline; color: inherit;
    text-decoration: underline; text-decoration-thickness: 2px;
    text-decoration-color: rgba(62,22,22,0.22); text-underline-offset: 3px;
  }
  a.row-title:hover { color: var(--mid); text-decoration-color: var(--orange); }
  .row-sub { display: block; font-size: 0.79rem; font-weight: 600; color: var(--ink-soft); margin-top: 4px; }
  .row-right { display: flex; align-items: center; gap: 7px; flex: none; }
  .pill {
    border: 2px solid var(--ink); border-radius: 999px; padding: 2px 8px;
    font-size: 0.79rem; font-weight: 800; font-family: "JetBrains Mono", monospace;
    flex: none; text-align: center; min-width: 45px;
  }
  .pill.good { background: var(--good-lo); color: var(--good); }
  .pill.mid  { background: var(--mid-lo);  color: var(--mid); }
  .pill.bad  { background: var(--bad-lo);  color: var(--bad); }
  .pill.none { background: var(--grey-lo); color: var(--grey); font-family: Nunito, sans-serif; font-size: 0.72rem; }
  .vod-dot {
    width: 23px; height: 23px; border-radius: 50%; flex: none;
    border: 2px solid var(--ink); background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .vod-dot svg { width: 10px; height: 10px; }
  /* NB: modifier is .off — .empty is the empty-result block, whose padding would
     stretch this dot into an oval. */
  .vod-dot.off { background: #ded4c4; color: var(--ink-soft); }
  .chev { color: var(--ink-soft); flex: none; display: flex; transition: transform 0.22s ease; }
  .chev svg { width: 15px; height: 15px; }
  .row.open .chev { transform: rotate(90deg); }

  .reveal { overflow: hidden; max-height: 0; transition: max-height 0.26s ease; }
  .row.open .reveal { max-height: 340px; }
  .reveal-in { padding: 2px 2px 14px 126px; display: flex; flex-direction: column; gap: 7px; }
  .vod-link {
    border: 2px solid var(--ink); border-radius: var(--r-mid); corner-shape: superellipse(1.6);
    background: #fff; padding: 8px 11px;
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; color: var(--ink);
  }
  .vod-link:hover { background: var(--orange-lo); }
  .vod-link svg { width: 13px; height: 13px; flex: none; color: var(--orange); }
  .vod-link .lab { flex: 1; min-width: 0; }
  .no-vod { font-size: 0.85rem; font-weight: 700; color: var(--ink-soft); }

  .empty { text-align: center; padding: 26px 10px; color: var(--ink-soft); font-weight: 700; }
  .snap {
    margin-top: 14px; padding-top: 12px; border-top: 2px solid rgba(62,22,22,0.16);
    font-size: 0.76rem; font-weight: 600; color: var(--ink-soft); line-height: 1.45;
  }
  .snap a { font-weight: 800; text-decoration: underline; color: var(--orange); }

  footer.foot { margin-top: 22px; text-align: center; font-size: 0.75rem; font-weight: 600; color: #8d9a86; }

  /* ---------- back to top ---------- */
  /* a watermelon wedge, point up — the SVG carries the whole look, so the
     button itself is just a transparent hit area */
  #up {
    position: fixed; right: 18px; bottom: 18px; z-index: 20;
    width: 64px; height: 64px; padding: 0;
    border: none; background: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 5px 0 rgba(0,0,0,0.5));
    opacity: 0; transform: translateY(14px) scale(0.9); pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #up.show { opacity: 1; transform: none; pointer-events: auto; }
  #up:hover { transform: translateY(-3px); }
  #up:active { transform: translateY(3px); filter: drop-shadow(0 1px 0 rgba(0,0,0,0.5)); }
  #up svg { width: 100%; height: 100%; display: block; }

  @media (max-width: 620px) {
    .shell { padding-top: 58px; }
    .card > .head { padding: 12px 14px 12px 154px; min-height: 56px; }
    h1 { font-size: 1.22rem; }
    .panda { width: 148px; top: -32px; left: -12px; }
    .poster-slot { width: 70px; height: 105px; font-size: 1.7rem; }
    .reveal-in { padding-left: 82px; }
    .row-main { gap: 11px; }
    /* the № is the sheet's own numbering — least useful thing to keep when the
       text column gets squeezed */
    .row-num { display: none; }
    .row-title { font-size: 0.98rem; }
    #up { right: 12px; bottom: 12px; width: 48px; height: 48px; }
  }
</style>
</head>
