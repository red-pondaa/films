<meta property="og:description" content="Личная страница red_pondaa: ссылки на площадки, просмотренные фильмы с записями стримов, коллекция игр и сборка ПК.">

<title>red_pondaa</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* One committed visual world: the Twitch-panel look is a black ground with
     cream sticker cards, so every colour is painted explicitly — no theme swap. */
  :root {
    --ground: #0e0e10;
    --ink: #3e1616;
    --ink-soft: #6d4038;
    --cream: #fbf3e6;

    --purple: #9a467e;  --purple-lo: #f7e5fa;
    --orange: #e07a00;  --orange-lo: #faeed9;
    --green:  #589353;  --green-lo:  #e5fae6;
    --blue:   #1c89c4;  --blue-lo:   #e5faf6;

    --good: #2f7d3a; --good-lo: #d8f0d4;
    --mid:  #a35c00; --mid-lo:  #fbe8c8;
    --bad:  #b3271e; --bad-lo:  #fadcd8;
    --grey: #6d6257; --grey-lo: #e8e0d2;

    --stroke: 3px;
    --drop: 0 5px 0 #000;
    --drop-sm: 0 3px 0 #000;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(900px 520px at 50% -8%, #1e1a22, transparent 70%), var(--ground);
    background-attachment: fixed;
    color: var(--cream);
    font-family: Nunito, "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 16px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; -webkit-appearance: none; appearance: none; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }

  .shell { max-width: 680px; margin: 0 auto; padding: 20px 16px 70px; }

  /* ---------- card primitive ---------- */
  .panel {
    border: var(--stroke) solid var(--ink); border-radius: 20px;
    background: var(--cream); box-shadow: var(--drop);
    overflow: hidden; color: var(--ink);
  }
  .panel-head {
    padding: 11px 16px; border-bottom: var(--stroke) solid var(--ink);
    font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.28);
  }
  .panel-body { padding: 14px 16px; }

  /* ---------- hero: the panda lies ON the card's top edge, at the left ---------- */
  .hero { position: relative; margin-top: 66px; }
  .hero .panda {
    position: absolute;
    left: -10px;             /* the front paw hangs over the card's left edge */
    top: -26px;              /* the card's top edge cuts through the body, so she lies on it */
    width: 168px; height: auto;
    z-index: 2; pointer-events: none;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.45));
  }
  .hero .panel-head {
    background: var(--purple);
    font-size: 1.5rem; letter-spacing: -0.01em;
    padding: 14px 16px 14px 186px;   /* clear the panda */
    min-height: 62px;
    display: flex; align-items: center;
  }
  .hero h1 { margin: 0; font-size: inherit; font-weight: 900; }

  /* ---------- switcher: four mini panels ---------- */
  .switcher { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0; }
  .switch {
    border: var(--stroke) solid var(--ink); border-radius: 15px;
    background: var(--cream); box-shadow: var(--drop-sm);
    padding: 0; overflow: hidden; cursor: pointer; color: var(--ink);
    display: flex; flex-direction: column; min-width: 0;
    transition: transform 0.14s ease, box-shadow 0.14s ease, filter 0.14s ease;
    filter: saturate(0.42) brightness(0.93);
  }
  .switch .cap { height: 24px; border-bottom: var(--stroke) solid var(--ink); display: flex; align-items: center; justify-content: center; }
  .switch .cap svg { width: 14px; height: 14px; color: #fff; }
  .switch .name {
    padding: 6px 3px; font-weight: 800; font-size: 0.78rem; text-align: center;
    min-width: 0; line-height: 1.15;
    flex: 1; display: flex; align-items: center; justify-content: center;
  }
  /* wrap rather than truncate — "Просмотрено" needs two lines on narrow phones */
  .switch .name span { display: block; overflow-wrap: anywhere; }
  .switch:hover { filter: saturate(0.75) brightness(1); }
  .switch:active { transform: translateY(3px); box-shadow: 0 0 0 #000; }
  .switch.active { filter: none; transform: translateY(-3px); box-shadow: 0 8px 0 #000; }
  .switch.active .name { font-weight: 900; }
  .switch[data-key="home"]   .cap { background: var(--purple); } .switch[data-key="home"]   .name { background: var(--purple-lo); }
  .switch[data-key="movies"] .cap { background: var(--orange); } .switch[data-key="movies"] .name { background: var(--orange-lo); }
  .switch[data-key="games"]  .cap { background: var(--green); }  .switch[data-key="games"]  .name { background: var(--green-lo); }
  .switch[data-key="pc"]     .cap { background: var(--blue); }   .switch[data-key="pc"]     .name { background: var(--blue-lo); }

  /* ---------- stats ---------- */
  .stats { display: flex; flex-wrap: wrap; gap: 7px; }
  .stat {
    border: 2px solid var(--ink); border-radius: 999px; padding: 5px 11px; background: #fff;
    font-size: 0.77rem; font-weight: 700; color: var(--ink-soft);
    display: inline-flex; align-items: baseline; gap: 5px;
  }
  .stat b { font-family: "JetBrains Mono", monospace; font-size: 0.84rem; color: var(--ink); font-weight: 700; }
  .stat b.plain { font-family: Nunito, sans-serif; font-size: 0.87rem; font-variant-numeric: tabular-nums; }

  /* ---------- toolbar ---------- */
  .toolbar { margin-top: 13px; }
  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-wrap > svg { position: absolute; left: 13px; width: 16px; height: 16px; color: var(--ink-soft); pointer-events: none; }
  .search-wrap input {
    width: 100%; border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink);
    padding: 9px 40px 9px 36px; font-size: 0.95rem; font-family: inherit; font-weight: 600;
  }
  .search-wrap input::placeholder { color: var(--ink-soft); font-weight: 600; }
  .search-wrap input:focus { outline: none; box-shadow: inset 0 0 0 2px currentColor; }
  .search-clear {
    position: absolute; right: 8px; border: none; background: var(--ink); color: var(--cream);
    width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 0.78rem;
    display: flex; align-items: center; justify-content: center;
  }
  .chipbar { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chipbar .lbl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .chip {
    border: 2px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink);
    padding: 4px 10px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.on { background: var(--ink); color: var(--cream); }
  .chip .arr { font-size: 0.7em; }
  .chip .cnt { font-family: "JetBrains Mono", monospace; font-size: 0.72rem; opacity: 0.7; }

  /* ---------- rows ---------- */
  .rows { list-style: none; margin: 14px 0 0; padding: 0; }
  .row { border-top: 2px solid rgba(62,22,22,0.16); }
  .row:first-child { border-top: none; }
  .row-main {
    width: 100%; display: flex; align-items: center; gap: 11px; padding: 11px 2px;
    border: none; background: none; text-align: left; cursor: pointer; color: var(--ink); font-family: inherit;
  }
  .row-num {
    font-family: "JetBrains Mono", monospace; font-size: 0.72rem; font-weight: 700;
    color: var(--ink-soft); min-width: 2.1em; flex: none; text-align: right;
  }
  .row-badge {
    width: 34px; height: 34px; border-radius: 10px; flex: none; border: 2px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 0.95rem; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  /* Poster slot: the letter is painted underneath, and the cover art — when it
     loads — sits on top of it. Where external images are blocked (the artifact
     viewer's CSP) the image simply never appears and the letter stays. */
  .row-badge.pos { width: 36px; height: 52px; border-radius: 8px; position: relative; overflow: hidden; }
  .row-badge .poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
    opacity: 0; transition: opacity 0.18s ease;   /* revealed only once it really loads */
  }
  .row-badge .poster.ok { opacity: 1; }
  .row-text { flex: 1; min-width: 0; }
  .row-title { display: block; font-weight: 800; font-size: 0.94rem; line-height: 1.25; }
  /* inline so the click target is the words themselves, not the whole line */
  a.row-title {
    display: inline; color: inherit;
    text-decoration: underline; text-decoration-thickness: 2px;
    text-decoration-color: rgba(62,22,22,0.22); text-underline-offset: 3px;
  }
  a.row-title:hover { color: var(--mid); text-decoration-color: var(--orange); }
  .row-sub { display: block; font-size: 0.76rem; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }
  .row-right { display: flex; align-items: center; gap: 7px; flex: none; }
  .pill {
    border: 2px solid var(--ink); border-radius: 999px; padding: 2px 8px;
    font-size: 0.76rem; font-weight: 800; font-family: "JetBrains Mono", monospace;
    flex: none; text-align: center;
  }
  .pill.good { background: var(--good-lo); color: var(--good); }
  .pill.mid  { background: var(--mid-lo);  color: var(--mid); }
  .pill.bad  { background: var(--bad-lo);  color: var(--bad); }
  .pill.none { background: var(--grey-lo); color: var(--grey); font-family: Nunito, sans-serif; font-size: 0.72rem; }
  .pill.slot-m { min-width: 42px; }
  .tag {
    border: 2px solid var(--ink); border-radius: 999px; padding: 2px 9px;
    font-size: 0.72rem; font-weight: 800; flex: none; white-space: nowrap;
  }
  .tag.done    { background: var(--good-lo); color: var(--good); }
  .tag.playing { background: #d9edfa; color: #12658f; }
  .tag.queue   { background: var(--mid-lo);  color: var(--mid); }
  .tag.dropped { background: var(--bad-lo);  color: var(--bad); }
  .tag.little  { background: var(--grey-lo); color: var(--grey); }
  .tag.wish    { background: #f3e3f7; color: #7d3a68; }
  .vod-dot {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    border: 2px solid var(--ink); background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .vod-dot svg { width: 10px; height: 10px; }
  /* NB: modifier is .off — .empty is the empty-result block, whose padding would
     stretch this dot into an oval. */
  .vod-dot.off { background: #ded4c4; color: var(--ink-soft); }
  .chev { color: var(--ink-soft); flex: none; display: flex; transition: transform 0.22s ease; }
  .chev svg { width: 15px; height: 15px; }
  .row.open .chev { transform: rotate(90deg); }

  .reveal { overflow: hidden; max-height: 0; transition: max-height 0.26s ease; }
  .row.open .reveal { max-height: 340px; }
  .reveal-in { padding: 2px 2px 13px 50px; display: flex; flex-direction: column; gap: 7px; }
  .vod-link {
    border: 2px solid var(--ink); border-radius: 12px; background: #fff; padding: 8px 11px;
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.84rem; color: var(--ink);
  }
  .vod-link:hover { background: var(--orange-lo); }
  .vod-link svg { width: 13px; height: 13px; flex: none; color: var(--orange); }
  .vod-link .lab { flex: 1; min-width: 0; }
  .no-vod { font-size: 0.84rem; font-weight: 700; color: var(--ink-soft); }

  .empty { text-align: center; padding: 26px 10px; color: var(--ink-soft); font-weight: 700; }
  .snap {
    margin-top: 13px; padding-top: 12px; border-top: 2px solid rgba(62,22,22,0.16);
    font-size: 0.76rem; font-weight: 600; color: var(--ink-soft); line-height: 1.45;
  }
  .snap a { font-weight: 800; text-decoration: underline; }

  /* ---------- home links ---------- */
  .links { display: flex; flex-direction: column; gap: 9px; }
  .link {
    display: flex; align-items: center; gap: 12px;
    border: var(--stroke) solid var(--ink); border-radius: 15px;
    background: #fff; padding: 10px 13px; box-shadow: var(--drop-sm);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .link:hover { background: var(--purple-lo); }
  .link:active { transform: translateY(3px); box-shadow: 0 0 0 #000; }
  .link .mark {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    border: 2px solid var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .link .mark svg { width: 20px; height: 20px; }
  .link .txt { flex: 1; min-width: 0; }
  .link .nm { display: block; font-weight: 900; font-size: 0.95rem; color: var(--ink); }
  .link .ad {
    display: block; font-size: 0.74rem; font-weight: 600; color: var(--ink-soft);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .link .go { color: var(--ink-soft); flex: none; display: flex; }
  .link .go svg { width: 15px; height: 15px; }

  /* ---------- pc ---------- */
  .quote {
    border: 2px solid var(--ink); border-radius: 15px; background: #fff;
    padding: 11px 13px; font-size: 0.84rem; font-weight: 600; color: var(--ink-soft);
    line-height: 1.5; margin-bottom: 14px;
  }
  .grp { font-size: 0.72rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em;
         color: var(--ink-soft); margin: 16px 0 6px 2px; }
  .spec { list-style: none; margin: 0; padding: 0; }
  .spec li { display: flex; gap: 10px; padding: 9px 2px; border-top: 2px solid rgba(62,22,22,0.16); align-items: baseline; }
  .spec li:first-child { border-top: none; }
  .spec .k {
    font-family: "JetBrains Mono", monospace; font-size: 0.71rem; font-weight: 700;
    color: var(--ink-soft); width: 112px; flex: none; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .spec .v { font-weight: 700; font-size: 0.9rem; flex: 1; min-width: 0; }
  .spec .v i { display: block; font-style: normal; font-weight: 600; font-size: 0.85rem; color: var(--ink-soft); }

  footer.foot { margin-top: 24px; text-align: center; font-size: 0.75rem; font-weight: 600; color: #6a6a72; line-height: 1.6; }

  @media (max-width: 560px) {
    .hero { margin-top: 54px; }
    .hero .panda { width: 138px; top: -21px; left: -8px; }
    .hero .panel-head { font-size: 1.2rem; padding-left: 152px; min-height: 54px; }
    .switch .name { font-size: 0.7rem; }
    .reveal-in { padding-left: 34px; }
    .spec .k { width: 92px; }
  }
  @media (max-width: 400px) {
    .switch .name { font-size: 0.63rem; }
    .spec li { flex-direction: column; gap: 2px; }
    .spec .k { width: auto; }
  }
</style>
</head>

    return f[2];

            I.play + '<span class="lab">' + esc(v.l || "Смотреть запись стрима") + "</span>" + I.ext + "</a>";
        }).join("")
      : '<div class="no-vod">Записи этого стрима не сохранилось :(</div>';
    var kp = m.k
      ? "https://www.kinopoisk.ru/" + (m.kt === "s" ? "series" : "film") + "/" + m.k + "/"
      : "https://www.kinopoisk.ru/index.php?kp_query=" + encodeURIComponent(m.t);
    // div, not button: it holds the title's <a>, which a button cannot contain
    return '<li class="row' + (open ? " open" : "") + '">' +
      '<div class="row-main" role="button" tabindex="0" aria-expanded="' + (open ? "true" : "false") + '" data-open="m' + m.n + '">' +
      '<span class="row-num mono">' + m.n + "</span>" +
      '<span class="row-badge pos" style="background:' + tint(m.t, PAL_M) + '">' +
      esc(m.t.trim().charAt(0).toUpperCase()) + posterImg(m) + "</span>" +
      '<span class="row-text">' +
      '<a class="row-title" href="' + esc(kp) + '" target="_blank" rel="noopener noreferrer">' + esc(m.t) + "</a>" +
      '<span class="row-sub">' + sub + "</span></span>" +
      '<span class="row-right"><span class="vod-dot' + (has ? "" : " off") + '">' + I.play + "</span>" +
      '<span class="pill slot-m ' + rClass(m.r) + '">' + (m.r == null ? "б/о" : m.r) + "</span>" +
      '<span class="chev">' + I.chev + "</span></span></div>" +
      '<div class="reveal"><div class="reveal-in">' + inner + "</div></div></li>";
  }

  function renderMovies() {
    var l = movieList(), s = movieStats();
    return '<div class="panel"><div class="panel-head" style="background:var(--orange)">Просмотрено</div>' +
      '<div class="panel-body" style="background:var(--orange-lo)">' +
      '<div class="stats">' +
      '<span class="stat"><b>' + s.total + "</b> " + plural(s.total, ["фильм", "фильма", "фильмов"]) + "</span>" +
      '<span class="stat"><b>' + s.avg + "</b> средняя</span>" +
      '<span class="stat"><b>' + s.tens + "</b> " + plural(s.tens, ["десятка", "десятки", "десяток"]) + "</span>" +
      '<span class="stat"><b>' + s.vods + "</b> с записью</span></div>" +
      '<div class="toolbar">' + searchBox("m-search", ui.mSearch, "Поиск по фильмам", "var(--orange)") + "</div>" +
      sortChips([{ f: "n", label: "По порядку" }, { f: "r", label: "Оценка" }, { f: "t", label: "Название" }],
                ui.mSort, ui.mDir, "data-msort") +
      (l.length ? '<ul class="rows">' + l.map(movieRow).join("") + "</ul>"
                : '<div class="empty">Ничего не нашлось по запросу «' + esc(ui.mSearch) + "»</div>") +
      '<div class="snap">Собрано из вашей таблицы — снимок от ' + esc(SYNCED) +
      '. <a href="' + esc(SHEETS.movies) + '" target="_blank" rel="noopener noreferrer" style="color:var(--orange)">Открыть таблицу</a>' +
      '</div></div></div>';
  }

  function gameRow(g) {
    return '<li class="row"><div class="row-main" style="cursor:default">' +
      '<span class="row-badge" style="background:' + tint(g.t, PAL_G) + '">' + esc(g.t.trim().charAt(0).toUpperCase()) + "</span>" +
      '<span class="row-text"><span class="row-title">' + esc(g.t) + "</span>" +
      '<span class="row-sub">' + esc(hoursOf(g.m)) + "</span></span>" +
      '<span class="row-right"><span class="tag ' + g.st + '">' + ST[g.st].label + "</span>" +
      (g.r == null ? "" : '<span class="pill slot-m ' + rClass(g.r) + '">' + g.r + "</span>") +
      "</span></div></li>";
  }

  function renderGames() {
    var l = gameList(), s = gameStats(), c = gameCounts();
    var filters = [{ f: "all", label: "Все", n: GAMES.length }].concat(
      ["playing", "done", "queue", "little", "dropped", "wish"].filter(function (k) { return c[k]; })
        .map(function (k) { return { f: k, label: ST[k].label, n: c[k] }; }));
    return '<div class="panel"><div class="panel-head" style="background:var(--green)">Игры</div>' +
      '<div class="panel-body" style="background:var(--green-lo)">' +
      '<div class="stats">' +
      '<span class="stat"><b>' + s.owned + "</b> " + plural(s.owned, ["игра", "игры", "игр"]) + "</span>" +
      '<span class="stat"><b>' + s.done + "</b> пройдено</span>" +
      '<span class="stat"><b>' + s.playing + "</b> в процессе</span>" +
      '<span class="stat"><b class="plain">' + group(s.hours) + "</b> ч наиграно</span>" +
      '<span class="stat"><b>' + s.avg + "</b> средняя</span></div>" +
      '<div class="toolbar">' + searchBox("g-search", ui.gSearch, "Поиск по играм", "var(--green)") + "</div>" +
      '<div class="chipbar"><span class="lbl">Статус</span>' +
      filters.map(function (f) {
        return '<button class="chip' + (ui.gFilter === f.f ? " on" : "") + '" data-gfilter="' + f.f + '">' +
          esc(f.label) + '<span class="cnt">' + f.n + "</span></button>";
      }).join("") + "</div>" +
      sortChips([{ f: "m", label: "Время" }, { f: "r", label: "Оценка" }, { f: "st", label: "Статус" }, { f: "t", label: "Название" }],
                ui.gSort, ui.gDir, "data-gsort") +
      (l.length ? '<ul class="rows">' + l.map(gameRow).join("") + "</ul>"
                : '<div class="empty">Ничего не нашлось</div>') +
      '<div class="snap">Собрано из вашей таблицы — снимок от ' + esc(SYNCED) + ". " + s.owned +
      " " + plural(s.owned, ["игра", "игры", "игр"]) + " в библиотеке и " + s.wish + " в желаемом. " +
      '<a href="' + esc(SHEETS.games) + '" target="_blank" rel="noopener noreferrer" style="color:var(--green)">Открыть таблицу</a>' +
      "</div></div></div>";
  }

  function specList(rows) {
    return '<ul class="spec">' + rows.map(function (r) {
      var v = r[1].split("|").map(function (x) { return esc(x); });
      return "<li><span class=\"k\">" + esc(r[0]) + "</span><span class=\"v\">" +
        (v.length > 1 ? v.map(function (x) { return "<i>" + x + "</i>"; }).join("") : v[0]) +
        "</span></li>";
    }).join("") + "</ul>";
  }

  function renderPC() {
    return '<div class="panel"><div class="panel-head" style="background:var(--blue)">Актуальный пека</div>' +
      '<div class="panel-body" style="background:var(--blue-lo)">' +
      '<div class="quote">' + esc(PC.note) + "</div>" +
      '<div class="grp">Комплектующие</div>' + specList(PC.build) +
      '<div class="grp">Периферия</div>' + specList(PC.gear) +
      '<div class="snap">Собрано из вашей таблицы — снимок от ' + esc(SYNCED) +
      '. <a href="' + esc(SHEETS.pc) + '" target="_blank" rel="noopener noreferrer" style="color:var(--blue)">Открыть таблицу</a>' +
      "</div></div></div>";
  }

  // ---------- render ----------

  function render() {
    var html = '<div class="hero"><img class="panda" src="' + PANDA + '" alt="">' +
      '<div class="panel"><div class="panel-head"><h1>red_pondaa</h1></div></div></div>' +
      '<div class="switcher">' +
      SECTIONS.map(function (s) {
        return '<button class="switch' + (ui.section === s.key ? " active" : "") + '" data-key="' + s.key + '">' +
          '<span class="cap">' + I[s.icon] + '</span><span class="name"><span>' + esc(s.label) + "</span></span></button>";
      }).join("") + "</div>";

    if (ui.section === "home") html += renderHome();
    else if (ui.section === "movies") html += renderMovies();
    else if (ui.section === "games") html += renderGames();
    else html += renderPC();


    document.getElementById("app").innerHTML = html;
    attach();
    bindPosters();
  }

  function on(sel, fn) {
    document.querySelectorAll(sel).forEach(function (el) { el.addEventListener("click", fn); });
  }

  function attach() {
    on("[data-key]", function (e) {
      ui.section = e.currentTarget.getAttribute("data-key");
      ui.open = null;
      render();
      window.scrollTo({ top: 0 });
    });

    on("[data-open]", function (e) {
      var k = e.currentTarget.getAttribute("data-open");
      ui.open = ui.open === k ? null : k;
      render();
    });
    // the title is a link inside a clickable row: let it navigate without toggling
    on("a.row-title", function (e) { e.stopPropagation(); });
    document.querySelectorAll('[data-open][role="button"]').forEach(function (el) {
      el.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") { e.preventDefault(); el.click(); }
      });
    });

    on("[data-msort]", function (e) {
      var f = e.currentTarget.getAttribute("data-msort");
      if (ui.mSort === f) ui.mDir *= -1; else { ui.mSort = f; ui.mDir = f === "r" ? -1 : 1; }
      render();
    });
    on("[data-gsort]", function (e) {
      var f = e.currentTarget.getAttribute("data-gsort");
      if (ui.gSort === f) ui.gDir *= -1; else { ui.gSort = f; ui.gDir = (f === "t" || f === "st") ? 1 : -1; }
      render();
    });
    on("[data-gfilter]", function (e) {
      ui.gFilter = e.currentTarget.getAttribute("data-gfilter");
      render();
    });

    ["m-search", "g-search"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", function (e) {
        if (id === "m-search") ui.mSearch = e.target.value; else ui.gSearch = e.target.value;
        render();
        var again = document.getElementById(id);
        if (again) { again.focus(); again.selectionStart = again.selectionEnd = again.value.length; }
      });
    });
    on("[data-clear]", function (e) {
      var id = e.currentTarget.getAttribute("data-clear");
      if (id === "m-search") ui.mSearch = ""; else ui.gSearch = "";
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
